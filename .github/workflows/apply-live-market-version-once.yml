name: Apply live market and preview version once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  improve:
    if: ${{ github.event.head_commit.message == 'Run live market and preview version improvements' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply improvements
        run: python scripts/apply-live-market-version.py
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Verify
        run: npm run verify
      - name: Commit verified improvements
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/apply-live-market-version-once.yml scripts/apply-live-market-version.py
          git add -A
          git commit -m "Add live USD market and preview build versioning"
          git push origin HEAD:refactor/stateless-invoice-issuance
