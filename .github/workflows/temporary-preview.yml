name: Create temporary PWA Preview

on:
  push:
    branches:
      - feature/payment-verification

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy temporary Preview
        shell: bash
        run: |
          verification_secret=$(openssl rand -hex 32)
          npx wrangler deploy --temporary --var "VERIFICATION_TOKEN_SECRET:$verification_secret"
