name: Verify creator support runtime

on:
  push:
    branches:
      - feature/creator-support-panel
    paths:
      - .github/workflows/verify-creator-support-runtime.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-support-panel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci
      - run: npx prettier --check src/app/CreatorContact.tsx src/app/CreatorContact.test.tsx src/app/CreatorContact.css
      - run: npm run lint
      - run: npx vitest run src/app/CreatorContact.test.tsx
      - run: npm run test
      - run: npm run worker:types:check
      - run: npm run test:worker
      - run: npm run build
      - run: npm run worker:dry-run

      - name: Remove one-time runtime verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-creator-support-runtime.yml
          git commit -m "Remove one-time support runtime verification workflow"
          git push origin HEAD:feature/creator-support-panel
