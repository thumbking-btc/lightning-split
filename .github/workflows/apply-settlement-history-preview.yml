name: Apply settlement history Preview integration

on:
  push:
    branches:
      - preview/settlement-history

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Merge settlement feature changes without altering the Preview base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/settlement-history
          git merge --no-commit --no-ff origin/feature/settlement-history || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$conflicts"
          fi

      - name: Apply Preview-compatible settlement history integration
        run: node scripts/apply-settlement-history-preview.mjs

      - run: npm ci
      - run: npm run format
      - run: npm run verify

      - name: Commit verified Preview integration
        run: |
          rm scripts/apply-settlement-history-preview.mjs
          rm .github/workflows/apply-settlement-history-preview.yml
          git add -A
          git diff --cached --check
          git commit -m "Preview settlement history on stateless worker"
          git push origin HEAD:preview/settlement-history
