name: Verify i18n multi currency

on:
  push:
    branches:
      - feat/i18n-multi-currency
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
