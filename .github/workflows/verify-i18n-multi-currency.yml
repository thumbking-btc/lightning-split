name: Verify i18n multi currency

on:
  push:
    branches:
      - feat/i18n-multi-currency
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/i18n-multi-currency
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply feature repairs
        run: node scripts/fix-i18n-feature.mjs
      - name: Format feature branch
        run: npx prettier --write .
      - name: Commit generated repairs when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Apply i18n feature repairs"
            git push origin HEAD:feat/i18n-multi-currency
          fi
      - name: Verify
        run: npm run verify
