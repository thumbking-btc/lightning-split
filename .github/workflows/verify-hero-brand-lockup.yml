name: Verify hero brand lockup

on:
  push:
    branches:
      - fix/hero-brand-lockup
    paths:
      - .github/workflows/verify-hero-brand-lockup.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run build
