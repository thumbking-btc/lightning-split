name: Format settlement history once

on:
  push:
    branches:
      - "feature/settlement-history-lifecycle"

permissions:
  contents: write

concurrency:
  group: format-settlement-history-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format repository
        run: npm run format
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format settlement history implementation"
          git push origin HEAD:${GITHUB_REF_NAME}
