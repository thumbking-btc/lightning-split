name: Format final settlement tests

on:
  push:
    branches:
      - feature/settlement-history-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settlement-history-v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format new tests
        run: npx prettier --write src/app/invoiceShare.test.ts src/app/settlementHistory.test.ts src/app/SettlementHistoryLaunch.test.tsx src/app/SettlementHistoryLayout.css
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/invoiceShare.test.ts src/app/settlementHistory.test.ts src/app/SettlementHistoryLaunch.test.tsx src/app/SettlementHistoryLayout.css
          git commit -m "style: format final settlement feature tests"
          git push origin HEAD:feature/settlement-history-v2
