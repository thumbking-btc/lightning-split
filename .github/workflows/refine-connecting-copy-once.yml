name: Refine connecting status wording once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance
    paths:
      - .github/workflows/refine-connecting-copy-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Refine connecting copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/i18n.ts')
          s = p.read_text()
          s = s.replace('checking: "확인 중…",', 'checking: "연결 중",')
          s = s.replace('checking: "Checking…",', 'checking: "Connecting",')
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''            {information?.premium\n              ? formatPremium(information.premium.basisPoints)\n              : c.premiumUnavailable}'''
          new = '''            {information?.premium\n              ? formatPremium(information.premium.basisPoints)\n              : connection === "unavailable" || connection === "stale"\n                ? c.premiumUnavailable\n                : c.checking}'''
          if old not in s:
              raise SystemExit('premium rendering block not found')
          p.write_text(s.replace(old, new))

          p = Path('src/App.test.tsx')
          s = p.read_text()
          s = s.replace('expect(html).toContain("비교 시세 확인 불가");', 'expect(html).toContain("연결 중");')
          p.write_text(s)
          PY
      - run: npm run format
      - run: npm run verify
      - name: Commit verified wording
        run: |
          rm .github/workflows/refine-connecting-copy-once.yml
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git add src/app/i18n.ts src/App.tsx src/App.test.tsx .github/workflows/refine-connecting-copy-once.yml
          git commit -m "Refine market connection status wording"
          git push origin HEAD:refactor/stateless-invoice-issuance
