name: Patch settlement history v2

on:
  push:
    branches:
      - feature/settlement-history-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settlement-history-v2
      - name: Apply exact source patches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExactly(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${path}: expected exactly one match, found ${count}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          const appWith = 'src/app/AppWithSettlementHistory.tsx';
          for (const unused of [
            '  sanitizeIntegerInput,\n',
            '  sanitizeUsdInput,\n',
            '  type SettlementPreview,\n',
            '  type MarketInformationState,\n',
            '  type UsdMarketInformationState,\n',
          ]) {
            const source = fs.readFileSync(appWith, 'utf8');
            if (!source.includes(unused)) throw new Error(`Missing import fragment: ${unused}`);
            fs.writeFileSync(appWith, source.replace(unused, ''));
          }

          replaceExactly(
            appWith,
            `function marketConnectionLabel(\n  connection:\n    | MarketInformationState["connection"]\n    | UsdMarketInformationState["connection"],\n  language: Language,\n): string {\n  const c = uiCopy(language);\n  if (connection === "live") return c.live;\n  if (connection === "recent") return c.recent;\n  if (connection === "stale") return c.stale;\n  if (connection === "unavailable") return c.unavailable;\n  return c.connecting;\n}\n\n// Keep this reference so type checking continues to cover both market hooks even\n// though the visual market summary itself remains implemented in ../App.\nvoid marketConnectionLabel;\n\n`,
            '',
          );

          replaceExactly(
            'src/App.tsx',
            '                <QrCode invoice={slot.invoice.bolt11} />',
            `                <QrCode\n                  invoice={slot.invoice.bolt11}\n                  shareInput={{\n                    slotNumber: slot.slotNumber,\n                    ...(slot.annotation?.displayName\n                      ? { displayName: slot.annotation.displayName }\n                      : {}),\n                    ...(slot.krwShare ? { krwShare: slot.krwShare } : {}),\n                    ...(slot.usdCentsShare\n                      ? { usdCentsShare: slot.usdCentsShare }\n                      : {}),\n                    targetSats: slot.targetSats,\n                    expiresAt: slot.invoice.expiresAt,\n                  }}\n                />`,
          );
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format patched files
        run: npx prettier --write src/App.tsx src/app/AppWithSettlementHistory.tsx
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/AppWithSettlementHistory.tsx
          git commit -m "fix: wire complete QR sharing and clean integration imports"
          git push origin HEAD:feature/settlement-history-v2
