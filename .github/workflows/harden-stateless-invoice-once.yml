name: Harden stateless invoice issuance once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply hardening
        run: python scripts/harden-stateless-invoice.py
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Verify
        run: npm run verify
      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/harden-stateless-invoice-once.yml
          git rm scripts/harden-stateless-invoice.py
          git add -A
          git commit -m "Fail closed on ambiguous invoice callbacks"
          git push origin HEAD:refactor/stateless-invoice-issuance
