name: Refine live market endpoints once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.event.head_commit.message == 'Run public market endpoint refinements' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply endpoint refinements
        run: python scripts/refine-live-market-endpoints.py
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format
      - name: Verify
        run: npm run verify
      - name: Commit verified refinements
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/refine-live-market-endpoints-once.yml scripts/refine-live-market-endpoints.py
          git add -A
          git commit -m "Refine public market data endpoints"
          git push origin HEAD:refactor/stateless-invoice-issuance
