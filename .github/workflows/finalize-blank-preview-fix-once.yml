name: Verify and finalize blank preview fix once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'Verify and finalize blank preview fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Full verification
        run: npm run verify
      - name: Remove temporary diagnostics after successful verification
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/browser-smoke-once.yml
          git rm .github/workflows/remote-preview-smoke-once.yml
          git rm .github/workflows/finalize-blank-preview-fix-once.yml
          git commit -m "Fix preview realtime CSP and PWA cache cleanup"
          git push origin HEAD:refactor/stateless-invoice-issuance
