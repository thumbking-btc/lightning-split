name: Restore main KRW parity once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance
    paths:
      - .github/workflows/restore-main-krw-parity-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Restore remaining KRW production presentation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()

          old = '''    <section className="market-summary" aria-label={c.currentMarket}>'''
          new = '''    <section\n      className="market-summary"\n      aria-label={\n        language === "ko"\n          ? "현재 비트코인 시장정보"\n          : "Current Bitcoin market information"\n      }\n    >'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 market summary labels, found {count}')
          s = s.replace(old, new)

          old = '''            <div>\n              <span>{c.fiatSharePerPerson}</span>\n              <strong>\n                {formatAmountRange(\n                  preview.invoiceShares,\n                  language === "ko" ? "원" : " KRW",\n                  language,\n                )}\n              </strong>\n            </div>'''
          new = '''            <div>\n              <span>\n                {language === "ko" ? "사람별 원화 몫" : c.fiatSharePerPerson}\n              </span>\n              <strong>\n                {formatAmountRange(\n                  preview.invoiceShares,\n                  language === "ko" ? "원" : " KRW",\n                  language,\n                )}\n              </strong>\n            </div>'''
          if old not in s:
              raise SystemExit('KRW share label pattern not found')
          s = s.replace(old, new, 1)

          old = '''          inputMode={inputMode === "usd" ? "decimal" : "numeric"}\n          value={totalAmount}'''
          new = '''          inputMode={inputMode === "usd" ? "decimal" : "numeric"}\n          pattern={inputMode === "usd" ? "[0-9]*[.]?[0-9]*" : "[0-9]*"}\n          value={totalAmount}'''
          if old not in s:
              raise SystemExit('amount input pattern marker not found')
          s = s.replace(old, new, 1)

          old = '''            {inputMode === "krw" ? "BTC/KRW" : "BTC/USD"}{" "}'''
          new = '''            {inputMode === "krw"\n              ? language === "ko"\n                ? "BTC 기준가격"\n                : "BTC/KRW"\n              : "BTC/USD"}{" "}'''
          if old not in s:
              raise SystemExit('price reference label pattern not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          test = Path('src/App.test.tsx')
          s = test.read_text()
          old = '''    expect(html).toContain('placeholder="0"');\n    expect(html).toContain(">원</button>");'''
          new = '''    expect(html).toContain('placeholder="0"');\n    expect(html).toContain('pattern="[0-9]*"');\n    expect(html).toContain(">원</button>");'''
          if old not in s:
              raise SystemExit('amount input parity test marker not found')
          s = s.replace(old, new, 1)

          old = '''    expect(html).toContain("가격 확인 시각");\n  });'''
          new = '''    expect(html).toContain("가격 확인 시각");\n    expect(html).toContain("사람별 원화 몫");\n  });'''
          if old not in s:
              raise SystemExit('KRW preview test marker not found')
          s = s.replace(old, new, 1)
          test.write_text(s)
          PY
      - run: npm run format
      - run: npm run verify
      - name: Commit verified parity restoration
        run: |
          rm .github/workflows/restore-main-krw-parity-once.yml
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git add src/App.tsx src/App.test.tsx .github/workflows/restore-main-krw-parity-once.yml
          git commit -m "Restore remaining KRW production presentation"
          git push origin HEAD:refactor/stateless-invoice-issuance
