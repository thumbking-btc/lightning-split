name: Fix settlement tracker fairness once

on:
  push:
    branches:
      - "feature/settlement-history-lifecycle"

permissions:
  contents: write

concurrency:
  group: fix-settlement-tracker-fairness-once
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded fair-rotation fix and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/app/settlementHistory.ts")
          source = source_path.read_text()
          source = source.replace(
              'const MAX_TRACKING_TARGETS_PER_PASS = 60;\n',
              'const MAX_TRACKING_TARGETS_PER_PASS = 60;\nconst TRACKING_SELECTION_PERIOD_MS = 60_000;\n',
              1,
          )
          marker = '''export function listLateSettlementTrackingTargets(\n  nowMs = Date.now(),\n): Promise<LateSettlementTrackingTarget[]> {\n'''
          helper = '''export function selectLateSettlementTrackingTargets(\n  targets: readonly LateSettlementTrackingTarget[],\n  nowMs: number,\n): LateSettlementTrackingTarget[] {\n  const ordered = [...targets].sort((a, b) => {\n    const expiryOrder = a.trackingExpiresAt.localeCompare(b.trackingExpiresAt);\n    if (expiryOrder !== 0) return expiryOrder;\n    return `${a.sessionId}:${a.slotNumber}:${a.attempt}:${a.paymentHash}`.localeCompare(\n      `${b.sessionId}:${b.slotNumber}:${b.attempt}:${b.paymentHash}`,\n    );\n  });\n  if (ordered.length <= MAX_TRACKING_TARGETS_PER_PASS) return ordered;\n\n  const period = Math.floor(nowMs / TRACKING_SELECTION_PERIOD_MS);\n  const start =\n    (period * MAX_TRACKING_TARGETS_PER_PASS) % ordered.length;\n  return Array.from(\n    { length: MAX_TRACKING_TARGETS_PER_PASS },\n    (_, offset) => ordered[(start + offset) % ordered.length]!,\n  );\n}\n\n'''
          if marker not in source:
              raise SystemExit("list marker not found")
          source = source.replace(marker, helper + marker, 1)
          old_return = '''    await transaction.done;\n    return targets\n      .sort((a, b) => a.trackingExpiresAt.localeCompare(b.trackingExpiresAt))\n      .slice(0, MAX_TRACKING_TARGETS_PER_PASS);\n'''
          new_return = '''    await transaction.done;\n    return selectLateSettlementTrackingTargets(targets, nowMs);\n'''
          if old_return not in source:
              raise SystemExit("target return block not found")
          source = source.replace(old_return, new_return, 1)
          source_path.write_text(source)

          test_path = Path("src/app/settlementHistory.test.ts")
          test = test_path.read_text()
          old_import = '''  listLateSettlementTrackingTargets,\n  listSettlementHistory,\n} from "./settlementHistory";\n'''
          new_import = '''  listLateSettlementTrackingTargets,\n  listSettlementHistory,\n  selectLateSettlementTrackingTargets,\n  type LateSettlementTrackingTarget,\n} from "./settlementHistory";\n'''
          if old_import not in test:
              raise SystemExit("test import marker not found")
          test = test.replace(old_import, new_import, 1)
          test += '''\n\ndescribe("late settlement tracking scheduling", () => {\n  it("rotates a bounded batch so later records are not starved", () => {\n    const targets: LateSettlementTrackingTarget[] = Array.from(\n      { length: 120 },\n      (_, index) => ({\n        sessionId: `session-${index.toString().padStart(3, "0")}`,\n        kind: "retired",\n        slotNumber: 1,\n        attempt: index + 1,\n        paymentHash: index.toString(16).padStart(64, "0"),\n        bolt11: `lnbc1${"q".repeat(30)}${index}`,\n        verificationToken: `v2.${"a".repeat(16)}.${"b".repeat(32)}`,\n        trackingExpiresAt: "2030-09-07T13:00:00.000Z",\n      }),\n    );\n\n    const first = selectLateSettlementTrackingTargets(targets, 0);\n    const second = selectLateSettlementTrackingTargets(targets, 60_000);\n\n    expect(first).toHaveLength(60);\n    expect(second).toHaveLength(60);\n    expect(new Set([...first, ...second].map((target) => target.sessionId)).size).toBe(\n      120,\n    );\n  });\n});\n'''
          test_path.write_text(test)
          PY
      - name: Format changed files
        run: npx prettier --write src/app/settlementHistory.ts src/app/settlementHistory.test.ts
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/settlementHistory.ts src/app/settlementHistory.test.ts
          git commit -m "fix: rotate archived settlement checks fairly"
          git push origin HEAD:${GITHUB_REF_NAME}
