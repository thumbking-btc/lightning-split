name: Browser smoke diagnostic once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.head_commit.message == 'Run browser smoke diagnostic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Vite preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1
      - name: Open app in Chromium and capture runtime errors
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('console', msg => {
            console.log(`[console:${msg.type()}] ${msg.text()}`);
            if (msg.type()==='error') errors.push(`console: ${msg.text()}`);
          });
          page.on('pageerror', err => {
            console.log(`[pageerror] ${err.stack || err.message}`);
            errors.push(`pageerror: ${err.stack || err.message}`);
          });
          const response = await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
          console.log('HTTP', response?.status());
          console.log('TITLE', await page.title());
          console.log('BODY_TEXT', (await page.locator('body').innerText()).slice(0,2000));
          console.log('ROOT_HTML', (await page.locator('#root').innerHTML()).slice(0,4000));
          await page.screenshot({path:'/tmp/smoke.png', fullPage:true});
          await browser.close();
          if (errors.length) {
            console.error('RUNTIME_ERRORS\n' + errors.join('\n'));
            process.exit(1);
          }
          const rootText = await (await chromium.launch({headless:true})).close().catch(()=>{});
          EOF
