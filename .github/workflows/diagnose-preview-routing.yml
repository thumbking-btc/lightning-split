name: Diagnose Preview routing

on:
  push:
    branches:
      - preview/settlement-history

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check known stateless Preview and settlement Preview
        shell: bash
        run: |
          set -u
          for url in \
            "https://refactor-stateless-invoice-issuance-lightning-split.thumbking-btc.workers.dev/" \
            "https://preview-settlement-history-lightning-split.thumbking-btc.workers.dev/"
          do
            echo "=== $url ==="
            status="$(curl -L -sS -o /tmp/body -w '%{http_code}' "$url" || true)"
            echo "HTTP $status"
            head -c 1000 /tmp/body || true
            echo
          done
