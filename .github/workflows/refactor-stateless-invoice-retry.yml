name: Retry stateless invoice refactor

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.event.head_commit.message == 'Retry stateless invoice refactor' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply refactor and test-environment fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/refactor-stateless-invoice-once.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          original_script = textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(original_script, '<stateless-refactor>', 'exec'))

          def replace_test_env(path: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('import { env } from "cloudflare:workers";\n', '')
              pattern = re.compile(
                  r'''const TEST_ENV = \{\n(?:  .*\n)+?\};''',
                  re.M,
              )
              replacement = '''const ALLOWING_RATE_LIMITER = {
                limit: () => Promise.resolve({ success: true }),
              } as unknown as RateLimit;
              const TEST_ENV = {
                INVOICE_RATE_LIMITER: ALLOWING_RATE_LIMITER,
                SETTLEMENT_RATE_LIMITER: ALLOWING_RATE_LIMITER,
                VERIFICATION_TOKEN_SECRET: "11".repeat(32),
              };'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'TEST_ENV replacement count in {path}: {count}')
              p.write_text(text, encoding='utf-8')

          replace_test_env('worker/api.test.ts')
          replace_test_env('worker/usdPrice.test.ts')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Verify refactor
        run: npm run verify
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/refactor-stateless-invoice-once.yml
          git rm .github/workflows/refactor-stateless-invoice-retry.yml
          git add -A
          git commit -m "Refactor invoice issuance to stateless worker"
          git push origin HEAD:refactor/stateless-invoice-issuance
