name: Apply market reconnect backoff once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance
    paths:
      - .github/workflows/apply-market-backoff-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Apply 15-30-60 reconnect backoff and 60s REST fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          # KRW realtime policy + helper
          p = Path('src/market/realtime.ts')
          s = p.read_text()
          s = s.replace('  reconnectDelayMs: 12_000,\n  liveRestRefreshMs: 60_000,\n  fallbackRestRefreshMs: 16_000,', '  reconnectDelaysMs: Object.freeze([15_000, 30_000, 60_000]),\n  liveRestRefreshMs: 60_000,\n  fallbackRestRefreshMs: 60_000,')
          marker = 'export function getMarketRestRefreshInterval(livePriceActive: boolean): number {'
          helper = '''export function getMarketReconnectDelay(attempt: number): number {\n  const delays = REALTIME_MARKET_POLICY.reconnectDelaysMs;\n  const index = Math.min(\n    Math.max(Number.isFinite(attempt) ? Math.trunc(attempt) : 0, 0),\n    delays.length - 1,\n  );\n  return delays[index]!;\n}\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          p.write_text(s)

          # USD realtime policy + helper
          p = Path('src/market/usdRealtime.ts')
          s = p.read_text()
          s = s.replace('  reconnectDelayMs: 12_000,\n  liveRestRefreshMs: 60_000,\n  fallbackRestRefreshMs: 16_000,', '  reconnectDelaysMs: Object.freeze([15_000, 30_000, 60_000]),\n  liveRestRefreshMs: 60_000,\n  fallbackRestRefreshMs: 60_000,')
          marker = 'export function getUsdMarketRestRefreshInterval('
          helper = '''export function getUsdMarketReconnectDelay(attempt: number): number {\n  const delays = USD_REALTIME_MARKET_POLICY.reconnectDelaysMs;\n  const index = Math.min(\n    Math.max(Number.isFinite(attempt) ? Math.trunc(attempt) : 0, 0),\n    delays.length - 1,\n  );\n  return delays[index]!;\n}\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker)
          p.write_text(s)

          # KRW hook
          p = Path('src/app/useMarketInformation.ts')
          s = p.read_text()
          s = s.replace('  getMarketRestRefreshDelay,\n  getMarketRestRefreshInterval,', '  getMarketReconnectDelay,\n  getMarketRestRefreshDelay,\n  getMarketRestRefreshInterval,')
          s = s.replace('    let reconnectTimer: number | undefined;\n    let renderTimer:', '    let reconnectTimer: number | undefined;\n    let reconnectAttempt = 0;\n    let renderTimer:')
          old = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      reconnectTimer = window.setTimeout(\n        connect,\n        REALTIME_MARKET_POLICY.reconnectDelayMs,\n      );\n    };'''
          new = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      const delay = getMarketReconnectDelay(reconnectAttempt);\n      reconnectAttempt += 1;\n      reconnectTimer = window.setTimeout(connect, delay);\n    };'''
          if old not in s:
              raise SystemExit('KRW reconnect block not found')
          s = s.replace(old, new)
          s = s.replace('      queuedPrice = undefined;\n      setStreamActive(false);', '      queuedPrice = undefined;\n      reconnectAttempt = 0;\n      setStreamActive(false);', 1)
          s = s.replace('      lastRenderedAt = Date.now();\n      lastLiveMessageAt = lastRenderedAt;', '      lastRenderedAt = Date.now();\n      lastLiveMessageAt = lastRenderedAt;\n      reconnectAttempt = 0;', 1)
          p.write_text(s)

          # USD hook: Coinbase and Binance both use progressive backoff
          p = Path('src/app/useUsdMarketInformation.ts')
          s = p.read_text()
          s = s.replace('  getUsdMarketRestRefreshDelay,\n  getUsdMarketRestRefreshInterval,', '  getUsdMarketReconnectDelay,\n  getUsdMarketRestRefreshDelay,\n  getUsdMarketRestRefreshInterval,')
          s = s.replace('    let reconnectTimer: number | undefined;\n    let renderTimer:', '    let reconnectTimer: number | undefined;\n    let reconnectAttempt = 0;\n    let renderTimer:', 1)
          old = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      reconnectTimer = window.setTimeout(\n        connect,\n        USD_REALTIME_MARKET_POLICY.reconnectDelayMs,\n      );\n    };'''
          new = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      const delay = getUsdMarketReconnectDelay(reconnectAttempt);\n      reconnectAttempt += 1;\n      reconnectTimer = window.setTimeout(connect, delay);\n    };'''
          if old not in s:
              raise SystemExit('Coinbase reconnect block not found')
          s = s.replace(old, new, 1)
          s = s.replace('      queuedPrice = undefined;\n      setStreamActive(false);', '      queuedPrice = undefined;\n      reconnectAttempt = 0;\n      setStreamActive(false);', 1)
          s = s.replace('      lastRenderedAt = Date.now();\n      lastLiveMessageAt = lastRenderedAt;', '      lastRenderedAt = Date.now();\n      lastLiveMessageAt = lastRenderedAt;\n      reconnectAttempt = 0;', 1)

          # Binance effect
          target = '    let socket: WebSocket | undefined;\n    let reconnectTimer: number | undefined;\n\n    const browserIsActive = () =>'
          replacement = '    let socket: WebSocket | undefined;\n    let reconnectTimer: number | undefined;\n    let reconnectAttempt = 0;\n\n    const browserIsActive = () =>'
          if target not in s:
              raise SystemExit('Binance timer declaration not found')
          s = s.replace(target, replacement, 1)
          old = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      reconnectTimer = window.setTimeout(\n        connect,\n        USD_REALTIME_MARKET_POLICY.reconnectDelayMs,\n      );\n    };'''
          new = '''    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      const delay = getUsdMarketReconnectDelay(reconnectAttempt);\n      reconnectAttempt += 1;\n      reconnectTimer = window.setTimeout(connect, delay);\n    };'''
          if old not in s:
              raise SystemExit('Binance reconnect block not found')
          s = s.replace(old, new, 1)
          s = s.replace('      reconnectTimer = undefined;\n      const activeSocket = socket;', '      reconnectTimer = undefined;\n      reconnectAttempt = 0;\n      const activeSocket = socket;', 1)
          s = s.replace('            premiumReferenceRef.current = reference;\n            const current = informationRef.current;', '            premiumReferenceRef.current = reference;\n            reconnectAttempt = 0;\n            const current = informationRef.current;', 1)
          p.write_text(s)

          # Tests
          p = Path('src/market/realtime.test.ts')
          s = p.read_text()
          s = s.replace('  getMarketRestRefreshDelay,\n  getMarketRestRefreshInterval,', '  getMarketReconnectDelay,\n  getMarketRestRefreshDelay,\n  getMarketRestRefreshInterval,')
          old = '''  it("uses the P2P calculator refresh policy without treating 60 seconds as the live price interval", () => {\n    expect(getMarketRestRefreshInterval(true)).toBe(60_000);\n    expect(getMarketRestRefreshInterval(false)).toBe(16_000);\n    expect(getMarketRestRefreshDelay(1_000, 16_000, 5_000)).toBe(12_000);\n    expect(getMarketRestRefreshDelay(1_000, 16_000, 20_000)).toBe(0);\n  });'''
          new = '''  it("uses 60-second REST backup and 15-30-60 WebSocket reconnect backoff", () => {\n    expect(getMarketRestRefreshInterval(true)).toBe(60_000);\n    expect(getMarketRestRefreshInterval(false)).toBe(60_000);\n    expect(getMarketRestRefreshDelay(1_000, 60_000, 5_000)).toBe(56_000);\n    expect(getMarketRestRefreshDelay(1_000, 60_000, 61_000)).toBe(0);\n    expect([0, 1, 2, 3, 20].map(getMarketReconnectDelay)).toEqual([\n      15_000,\n      30_000,\n      60_000,\n      60_000,\n      60_000,\n    ]);\n  });'''
          if old not in s:
              raise SystemExit('KRW policy test block not found')
          p.write_text(s.replace(old, new))

          p = Path('src/market/usdRealtime.test.ts')
          s = p.read_text()
          s = s.replace('  createCoinbaseTickerSubscription,\n  parseBinanceTradeMessage,', '  createCoinbaseTickerSubscription,\n  getUsdMarketReconnectDelay,\n  getUsdMarketRestRefreshInterval,\n  parseBinanceTradeMessage,')
          anchor = 'describe("Coinbase realtime BTC/USD", () => {\n'
          test = '''  it("uses 60-second REST backup and 15-30-60 reconnect backoff", () => {\n    expect(getUsdMarketRestRefreshInterval(true)).toBe(60_000);\n    expect(getUsdMarketRestRefreshInterval(false)).toBe(60_000);\n    expect([0, 1, 2, 3, 20].map(getUsdMarketReconnectDelay)).toEqual([\n      15_000,\n      30_000,\n      60_000,\n      60_000,\n      60_000,\n    ]);\n  });\n\n'''
          if test not in s:
              s = s.replace(anchor, anchor + test)
          p.write_text(s)
          PY
      - run: npm run format
      - run: npm run verify
      - name: Commit verified policy
        run: |
          rm .github/workflows/apply-market-backoff-once.yml
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git add src/market/realtime.ts src/market/usdRealtime.ts src/app/useMarketInformation.ts src/app/useUsdMarketInformation.ts src/market/realtime.test.ts src/market/usdRealtime.test.ts .github/workflows/apply-market-backoff-once.yml
          git commit -m "Use 15-30-60 market reconnect backoff"
          git push origin HEAD:refactor/stateless-invoice-issuance
