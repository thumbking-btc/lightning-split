name: Verify settlement history Preview URL

on:
  push:
    branches:
      - preview/settlement-history

permissions:
  contents: read

jobs:
  smoke-test-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Preview and verify app shell
        shell: bash
        run: |
          set -euo pipefail
          url="https://preview-settlement-history-lightning-split.thumbking-btc.workers.dev/"
          for attempt in $(seq 1 18); do
            status="$(curl -L -sS -o /tmp/preview.html -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ] && grep -Eiq 'LIGHTNING SPLIT|Lightning Split' /tmp/preview.html; then
              echo "Verified PWA Preview: $url"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; Preview not ready yet."
            sleep 5
          done
          echo "Preview URL did not serve the Lightning Split app shell."
          cat /tmp/preview.html || true
          exit 1
