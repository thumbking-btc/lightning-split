name: Fix live Coinbase Premium once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance
    paths:
      - .github/workflows/fix-live-coinbase-premium-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Apply browser-side Binance reference stream
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {s.count(old)}')
              p.write_text(s.replace(old, new))

          # CSP: allow Binance public market-data websocket.
          replace_once(
              'public/_headers',
              "connect-src 'self' wss://api.upbit.com wss://advanced-trade-ws.coinbase.com;",
              "connect-src 'self' wss://api.upbit.com wss://advanced-trade-ws.coinbase.com wss://data-stream.binance.vision;",
          )

          # Copy: use a specific, natural label instead of the vague temporary-error wording.
          replace_once('src/app/i18n.ts', 'premiumUnavailable: "기준 시세 확인 불가",', 'premiumUnavailable: "비교 시세 확인 불가",')
          replace_once('src/app/i18n.ts', 'premiumUnavailable: "Reference price unavailable",', 'premiumUnavailable: "Comparison price unavailable",')
          replace_once('src/App.test.tsx', 'expect(html).toContain("기준 시세 확인 불가")', 'expect(html).toContain("비교 시세 확인 불가")')

          # Realtime helpers: parse Binance BTCUSDT trades and attach a live premium even if REST premium was absent.
          p = Path('src/market/usdRealtime.ts')
          s = p.read_text()
          s = s.replace(
              '  websocketUrl: "wss://advanced-trade-ws.coinbase.com",\n  productId: "BTC-USD",',
              '  websocketUrl: "wss://advanced-trade-ws.coinbase.com",\n  binanceWebsocketUrl: "wss://data-stream.binance.vision:443/ws/btcusdt@trade",\n  productId: "BTC-USD",',
          )
          anchor = '''export async function parseCoinbaseTickerMessage(\n  data: unknown,\n  nowMs = Date.now(),\n): Promise<LiveUsdMarketPrice | null> {'''
          if anchor not in s:
              raise SystemExit('Coinbase parser anchor missing')
          insert_before = '''export async function parseBinanceTradeMessage(\n  data: unknown,\n  nowMs = Date.now(),\n): Promise<LiveUsdMarketPrice | null> {\n  const text = await messageText(data);\n  if (text === null) return null;\n  let value: unknown;\n  try {\n    value = JSON.parse(text);\n  } catch {\n    return null;\n  }\n  if (\n    !isRecord(value) ||\n    value.e !== "trade" ||\n    value.s !== "BTCUSDT" ||\n    typeof value.E !== "number"\n  )\n    return null;\n  const ageMs = nowMs - value.E;\n  if (\n    ageMs > USD_REALTIME_MARKET_POLICY.maximumLivePriceAgeMs ||\n    ageMs < -USD_REALTIME_MARKET_POLICY.maximumFutureClockSkewMs\n  )\n    return null;\n  const priceUsdCents = decimalUsdToCents(value.p);\n  return priceUsdCents === null\n    ? null\n    : Object.freeze({ priceUsdCents, observedAtMs: value.E });\n}\n\n'''
          s = s.replace(anchor, insert_before + anchor, 1)
          marker = '''export function withLiveUsdMarketPrice(\n  information: UsdPriceResponseDto,'''
          if marker not in s:
              raise SystemExit('withLiveUsdMarketPrice anchor missing')
          premium_helper = '''export function withLiveUsdPremiumReference(\n  information: UsdPriceResponseDto,\n  reference: LiveUsdMarketPrice,\n  retrievedAtMs = Date.now(),\n): UsdPriceResponseDto {\n  return Object.freeze({\n    ...information,\n    premium: {\n      basisPoints: calculateCoinbasePremiumBasisPoints(\n        BigInt(information.snapshot.priceUsdCents),\n        reference.priceUsdCents,\n      ).toString(),\n      referencePriceUsdCents: reference.priceUsdCents.toString(),\n      retrievedAt: new Date(retrievedAtMs).toISOString(),\n    },\n  });\n}\n\n'''
          s = s.replace(marker, premium_helper + marker, 1)
          p.write_text(s)

          # Tests for the Binance public trade stream and creation of premium when REST did not provide one.
          p = Path('src/market/usdRealtime.test.ts')
          s = p.read_text()
          s = s.replace(
              '  parseCoinbaseTickerMessage,\n  withLiveUsdMarketPrice,',
              '  parseBinanceTradeMessage,\n  parseCoinbaseTickerMessage,\n  withLiveUsdMarketPrice,\n  withLiveUsdPremiumReference,',
          )
          test_anchor = '''  it("recalculates Coinbase Premium from the live Coinbase price", () => {'''
          if test_anchor not in s:
              raise SystemExit('USD realtime test anchor missing')
          new_test = '''  it("parses Binance BTCUSDT trade data and creates a premium without REST premium", async () => {\n    const now = Date.parse("2030-01-01T00:00:10.000Z");\n    const reference = await parseBinanceTradeMessage(\n      JSON.stringify({\n        e: "trade",\n        E: Date.parse("2030-01-01T00:00:09.500Z"),\n        s: "BTCUSDT",\n        p: "100000.00",\n      }),\n      now,\n    );\n    expect(reference).toEqual({\n      priceUsdCents: 10_000_000n,\n      observedAtMs: Date.parse("2030-01-01T00:00:09.500Z"),\n    });\n    const information = withLiveUsdPremiumReference(\n      {\n        ok: true,\n        snapshot: {\n          priceUsdCents: "10100000",\n          source: "coinbase",\n          market: "BTC-USD",\n          observedAt: "2030-01-01T00:00:09.000Z",\n          retrievedAt: "2030-01-01T00:00:09.000Z",\n          snapshotAt: "2030-01-01T00:00:09.000Z",\n          fallbackUsed: false,\n        },\n      },\n      reference!,\n      now,\n    );\n    expect(information.premium?.basisPoints).toBe("100");\n    expect(information.premium?.referencePriceUsdCents).toBe("10000000");\n  });\n\n'''
          s = s.replace(test_anchor, new_test + test_anchor, 1)
          p.write_text(s)

          # Hook: maintain a second lightweight public websocket for Binance only while USD is active.
          p = Path('src/app/useUsdMarketInformation.ts')
          s = p.read_text()
          s = s.replace(
              '  getUsdMarketRestRefreshInterval,\n  parseCoinbaseTickerMessage,',
              '  getUsdMarketRestRefreshInterval,\n  parseBinanceTradeMessage,\n  parseCoinbaseTickerMessage,',
          )
          s = s.replace(
              '  withLiveUsdMarketPrice,\n  type LiveUsdMarketPrice,',
              '  withLiveUsdMarketPrice,\n  withLiveUsdPremiumReference,\n  type LiveUsdMarketPrice,',
          )
          s = s.replace(
              '  const informationRef = useRef<UsdPriceResponseDto | undefined>(undefined);\n  const livePriceActiveRef = useRef(false);',
              '  const informationRef = useRef<UsdPriceResponseDto | undefined>(undefined);\n  const premiumReferenceRef = useRef<LiveUsdMarketPrice | undefined>(undefined);\n  const livePriceActiveRef = useRef(false);',
          )
          old = '''      const next = withLiveUsdMarketPrice(current, price);\n      lastRenderedAt = Date.now();'''
          new = '''      let next = withLiveUsdMarketPrice(current, price);\n      if (premiumReferenceRef.current)\n        next = withLiveUsdPremiumReference(next, premiumReferenceRef.current);\n      lastRenderedAt = Date.now();'''
          if old not in s:
              raise SystemExit('Coinbase flush anchor missing')
          s = s.replace(old, new, 1)
          return_anchor = '''  return { market, refreshLockedSnapshot: refresh };\n}'''
          if return_anchor not in s:
              raise SystemExit('USD hook return anchor missing')
          binance_effect = '''  useEffect(() => {\n    if (!enabled) return undefined;\n    let disposed = false;\n    let socket: WebSocket | undefined;\n    let reconnectTimer: number | undefined;\n\n    const browserIsActive = () =>\n      document.visibilityState === "visible" && navigator.onLine !== false;\n    const scheduleReconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      if (disposed || !browserIsActive()) return;\n      reconnectTimer = window.setTimeout(\n        connect,\n        USD_REALTIME_MARKET_POLICY.reconnectDelayMs,\n      );\n    };\n    const disconnect = () => {\n      if (reconnectTimer !== undefined) window.clearTimeout(reconnectTimer);\n      reconnectTimer = undefined;\n      const activeSocket = socket;\n      socket = undefined;\n      activeSocket?.close();\n    };\n    const connect = () => {\n      if (disposed || !browserIsActive() || socket) return;\n      try {\n        const nextSocket = new WebSocket(\n          USD_REALTIME_MARKET_POLICY.binanceWebsocketUrl,\n        );\n        socket = nextSocket;\n        nextSocket.onmessage = (event) => {\n          void parseBinanceTradeMessage(event.data).then((reference) => {\n            if (!reference || disposed || socket !== nextSocket) return;\n            premiumReferenceRef.current = reference;\n            const current = informationRef.current;\n            if (!current || current.snapshot.source !== "coinbase") return;\n            setInformation(\n              withLiveUsdPremiumReference(current, reference),\n              livePriceActiveRef.current ? "live" : "recent",\n            );\n          });\n        };\n        nextSocket.onerror = () => {\n          if (socket === nextSocket) nextSocket.close();\n        };\n        nextSocket.onclose = () => {\n          if (socket !== nextSocket) return;\n          socket = undefined;\n          scheduleReconnect();\n        };\n      } catch {\n        scheduleReconnect();\n      }\n    };\n    const handleVisibilityChange = () => {\n      if (document.visibilityState !== "visible") disconnect();\n      else connect();\n    };\n    const handleOnline = () => connect();\n    const handleOffline = () => disconnect();\n\n    document.addEventListener("visibilitychange", handleVisibilityChange);\n    window.addEventListener("online", handleOnline);\n    window.addEventListener("offline", handleOffline);\n    if (browserIsActive()) connect();\n    return () => {\n      disposed = true;\n      document.removeEventListener("visibilitychange", handleVisibilityChange);\n      window.removeEventListener("online", handleOnline);\n      window.removeEventListener("offline", handleOffline);\n      disconnect();\n    };\n  }, [enabled, setInformation]);\n\n'''
          s = s.replace(return_anchor, binance_effect + return_anchor, 1)
          p.write_text(s)
          PY
      - run: npm run format
      - run: npm run verify
      - name: Commit verified fix and remove workflow
        run: |
          rm .github/workflows/fix-live-coinbase-premium-once.yml
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git add -A
          git commit -m "Calculate Coinbase Premium from live Binance market data"
          git push origin HEAD:refactor/stateless-invoice-issuance
