name: Fix market reactivation delay once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance
    paths:
      - .github/workflows/fix-market-reactivation-delay-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - name: Make first refresh immediate after currency activation
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              ('src/app/useMarketInformation.ts', '  useEffect(() => {\n    if (!enabled) return undefined;\n    let disposed = false;\n    let timer: number | undefined;'),
              ('src/app/useUsdMarketInformation.ts', '  useEffect(() => {\n    if (!enabled) return undefined;\n    let disposed = false;\n    let timer: number | undefined;'),
          ]

          insertion = '''  useEffect(() => {\n    if (!enabled) return;\n    // Re-selecting a currency is a new active viewing session. Do not inherit\n    // the previous fallback polling delay; fetch once immediately instead.\n    lastRestRequestAtRef.current = 0;\n  }, [enabled]);\n\n'''

          for filename, anchor in targets:
              path = Path(filename)
              text = path.read_text()
              if insertion in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one polling anchor in {filename}, got {text.count(anchor)}')
              path.write_text(text.replace(anchor, insertion + anchor, 1))
          PY
      - run: npm run format
      - run: npm run verify
      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-market-reactivation-delay-once.yml
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git add src/app/useMarketInformation.ts src/app/useUsdMarketInformation.ts .github/workflows/fix-market-reactivation-delay-once.yml
          git commit -m "Refresh market immediately when currency is selected"
          git push origin HEAD:refactor/stateless-invoice-issuance
