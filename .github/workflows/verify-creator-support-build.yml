name: Verify creator support build

on:
  push:
    branches:
      - feature/creator-support-panel
    paths:
      - .github/workflows/verify-creator-support-build.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-support-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx prettier --check src/app/CreatorContact.tsx src/app/CreatorContact.test.tsx src/app/CreatorContact.css
      - run: npm run lint
      - run: npx vitest run src/app/CreatorContact.test.tsx src/app/qr.test.ts
      - run: npm run worker:types:check
      - run: npm run test:worker
      - run: npm run build
      - run: npm run worker:dry-run
