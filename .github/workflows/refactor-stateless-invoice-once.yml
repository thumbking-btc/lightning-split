name: Refactor stateless invoice issuance once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.event.head_commit.message == 'Prepare stateless invoice refactor' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Apply stateless refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old[:80]!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          Path("worker/invoiceBatch.ts").write_text(textwrap.dedent('''\
          import type {
            BatchInvoiceResponseDto,
            FailedInvoiceSlotDto,
            PendingInvoiceSlotDto,
          } from "../src/api/contracts";
          import { serializeBigIntDecimal } from "../src/api/serialization";
          import {
            generateInvoiceBatch,
            type GenerateInvoiceBatchInput,
          } from "../src/lightning/batch";
          import { LnurlPayClient } from "../src/lightning/lnurl";
          import { sealVerificationContext } from "./verification";

          interface InvoiceBatchEnv {
            readonly VERIFICATION_TOKEN_SECRET?: string;
          }

          function optionalVerificationSecret(env: InvoiceBatchEnv): string | undefined {
            return env.VERIFICATION_TOKEN_SECRET &&
              /^[0-9a-f]{64}$/u.test(env.VERIFICATION_TOKEN_SECRET)
              ? env.VERIFICATION_TOKEN_SECRET
              : undefined;
          }

          export async function createInvoiceBatchResponse(
            input: GenerateInvoiceBatchInput,
            env: InvoiceBatchEnv,
          ): Promise<BatchInvoiceResponseDto> {
            const result = await generateInvoiceBatch(input, {
              client: new LnurlPayClient(),
            });
            const secret = optionalVerificationSecret(env);
            const slots = await Promise.all(
              result.slots.map(
                async (slot): Promise<PendingInvoiceSlotDto | FailedInvoiceSlotDto> => {
                  const base = {
                    slotNumber: slot.slotNumber,
                    targetSats: serializeBigIntDecimal(slot.targetSats),
                    attempt: slot.attempt,
                    ...(slot.krwShare === undefined
                      ? {}
                      : { krwShare: serializeBigIntDecimal(slot.krwShare) }),
                  };
                  if (slot.status === "failed") {
                    return { ...base, status: "failed", failure: slot.failure };
                  }
                  let verificationToken: string | undefined;
                  if (secret && slot.invoice.verifyUrl !== undefined) {
                    try {
                      verificationToken = await sealVerificationContext(
                        {
                          verifyUrl: slot.invoice.verifyUrl,
                          expectedPaymentHash: slot.invoice.paymentHash,
                          expectedInvoice: slot.invoice.bolt11,
                          expiresAt: slot.invoice.expiresAt,
                        },
                        secret,
                      );
                    } catch {
                      // LUD-21 automation is optional. The validated invoice remains
                      // payable and the client will offer explicit manual confirmation.
                    }
                  }
                  return {
                    ...base,
                    status: "pending",
                    invoice: {
                      bolt11: slot.invoice.bolt11,
                      paymentHash: slot.invoice.paymentHash,
                      timestampSeconds: slot.invoice.timestampSeconds,
                      expirySeconds: slot.invoice.expirySeconds,
                      expiresAt: slot.invoice.expiresAt,
                      payeeNodeId: slot.invoice.payeeNodeId,
                      featureBits: slot.invoice.featureBits,
                      providerDomain: slot.invoice.provider.domain,
                      ...(slot.invoice.disposable === undefined
                        ? {}
                        : { disposable: slot.invoice.disposable }),
                      ...(verificationToken === undefined
                        ? {}
                        : { verificationToken }),
                    },
                  };
                },
              ),
            );
            return Object.freeze({
              ok: true,
              provider: {
                domain: result.discovery.domain,
                commentAllowed: result.discovery.commentAllowed,
                ...(result.providerCommentStatus === undefined
                  ? {}
                  : { commentStatus: result.providerCommentStatus }),
              },
              slots: Object.freeze(slots),
              completedCount: result.completedCount,
              failedCount: slots.filter((slot) => slot.status === "failed").length,
            });
          }
          '''), encoding="utf-8")

          replace_once(
              "worker/index.ts",
              'import { fingerprintInvoiceBatchInput } from "./invoiceBatch";',
              'import { createInvoiceBatchResponse } from "./invoiceBatch";',
          )
          replace_once(
              "worker/index.ts",
              '\nexport { InvoiceBatchCoordinator } from "./invoiceBatch";\n',
              '\n',
          )
          old_handle = '''async function handleInvoices(
            request: Request,
            env: AppEnv,
          ): Promise<Response> {
            assertSameOrigin(request);
            await enforceRateLimit(request, env.INVOICE_RATE_LIMITER, "invoices");
            const input = parseBatchInvoiceRequest(await readBoundedRequestJson(request));
            const coordinated = await env.INVOICE_BATCHES.getByName(
              input.requestId,
            ).issueForApi(
              await fingerprintInvoiceBatchInput(input),
              input,
              optionalVerificationSecret(env),
            );
            if (!coordinated.ok) {
              throw new InfrastructureError(
                coordinated.error.code,
                coordinated.error.message,
                {
                  retryable: coordinated.error.retryable,
                  ...(coordinated.error.upstreamStatus === undefined
                    ? {}
                    : { upstreamStatus: coordinated.error.upstreamStatus }),
                  ...(coordinated.error.retryAfterSeconds === undefined
                    ? {}
                    : { retryAfterSeconds: coordinated.error.retryAfterSeconds }),
                },
              );
            }
            return jsonResponse(coordinated.response);
          }'''
          new_handle = '''async function handleInvoices(
            request: Request,
            env: AppEnv,
          ): Promise<Response> {
            assertSameOrigin(request);
            await enforceRateLimit(request, env.INVOICE_RATE_LIMITER, "invoices");
            const input = parseBatchInvoiceRequest(await readBoundedRequestJson(request));
            const secret = optionalVerificationSecret(env);
            return jsonResponse(
              await createInvoiceBatchResponse(
                input,
                secret === undefined ? {} : { VERIFICATION_TOKEN_SECRET: secret },
              ),
            );
          }'''
          replace_once("worker/index.ts", old_handle, new_handle)

          api_path = Path("src/app/api.ts")
          api_text = api_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''export async function requestInvoiceBatch\(\n  input: BatchInvoiceRequestDto,\n\): Promise<BatchInvoiceResponseDto> \{\n.*?\n  if \(\n    !isRecord\(value\)''',
              re.S,
          )
          replacement = '''export async function requestInvoiceBatch(
            input: BatchInvoiceRequestDto,
          ): Promise<BatchInvoiceResponseDto> {
            let response: Response;
            try {
              response = await fetch("/api/invoices", {
                method: "POST",
                headers: {
                  Accept: "application/json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(input),
              });
            } catch {
              throw new ApiClientError(
                "ISSUANCE_UNKNOWN",
                "결제 요청 발급 결과를 확인할 수 없습니다. 받는 지갑을 확인한 뒤 새 정산을 시작하십시오.",
                false,
              );
            }
            const value = await parseApiResponse(response);
            if (
              !isRecord(value)'''
          api_text, count = pattern.subn(replacement, api_text, count=1)
          if count != 1:
              raise SystemExit(f"requestInvoiceBatch replacement count: {count}")
          api_path.write_text(api_text, encoding="utf-8")

          app_test = Path("src/app/api.test.ts")
          text = app_test.read_text(encoding="utf-8")
          test_pattern = re.compile(
              r'''  it\("replays an idempotent request once after a network failure", async \(\) => \{.*?\n  \}\);''',
              re.S,
          )
          test_replacement = '''  it("does not automatically replay an invoice request after a network failure", async () => {
            const fetcher = vi.fn().mockRejectedValueOnce(new TypeError("connection reset"));
            vi.stubGlobal("fetch", fetcher);

            await expect(requestInvoiceBatch(request)).rejects.toMatchObject({
              code: "ISSUANCE_UNKNOWN",
              retryable: false,
            });
            expect(fetcher).toHaveBeenCalledOnce();
          });'''
          text, count = test_pattern.subn(test_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"api test replacement count: {count}")
          app_test.write_text(text, encoding="utf-8")

          worker_test = Path("worker/api.test.ts")
          text = worker_test.read_text(encoding="utf-8")
          text = text.replace('  INVOICE_BATCHES: env.INVOICE_BATCHES,\n', '')
          replay_pattern = re.compile(
              r'''  it\("replays an idempotent batch without issuing new provider invoices", async \(\) => \{.*?\n  \}\);''',
              re.S,
          )
          replay_replacement = '''  it("does not keep replay state between accepted invoice requests", async () => {
            const provider = mockInvoiceProvider();
            const request = invoiceRequest("stateless-repeat");
            const first = await callWorker(apiRequest("/api/invoices", request));
            const second = await callWorker(apiRequest("/api/invoices", request));

            expect(first.status).toBe(200);
            expect(second.status).toBe(200);
            expect(provider.discovery).toHaveBeenCalledTimes(2);
            expect(provider.callback).toHaveBeenCalledTimes(4);
          });'''
          text, count = replay_pattern.subn(replay_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"worker replay test replacement count: {count}")
          conflict_pattern = re.compile(
              r'''  it\("rejects reuse of an idempotency key with different input", async \(\) => \{.*?\n  \}\);''',
              re.S,
          )
          conflict_replacement = '''  it("does not coordinate repeated request keys with different input", async () => {
            const provider = mockInvoiceProvider();
            const first = await callWorker(
              apiRequest("/api/invoices", invoiceRequest("legacy-correlation-key", 1)),
            );
            const second = await callWorker(
              apiRequest("/api/invoices", invoiceRequest("legacy-correlation-key", 2)),
            );

            expect(first.status).toBe(200);
            expect(second.status).toBe(200);
            expect(provider.discovery).toHaveBeenCalledTimes(2);
            expect(provider.callback).toHaveBeenCalledTimes(3);
          });'''
          text, count = conflict_pattern.subn(conflict_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"worker conflict test replacement count: {count}")
          worker_test.write_text(text, encoding="utf-8")

          replace_once(
              "src/api/contracts.ts",
              '/** Client-generated key used to make a retried batch request idempotent. */',
              '/** Client correlation key retained for compatibility; the Worker does not persist or replay it. */',
          )

          Path("wrangler.jsonc").write_text(textwrap.dedent('''\
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "lightning-split",
            "main": "./worker/index.ts",
            "compatibility_date": "2026-08-30",
            "compatibility_flags": ["nodejs_compat"],
            "ratelimits": [
              {
                "name": "INVOICE_RATE_LIMITER",
                "namespace_id": "2026083001",
                "simple": { "limit": 30, "period": 60 },
              },
              {
                "name": "SETTLEMENT_RATE_LIMITER",
                "namespace_id": "2026083002",
                "simple": { "limit": 300, "period": 60 },
              },
            ],
            "exports": {
              "InvoiceBatchCoordinator": {
                "type": "durable-object",
                "state": "deleted",
              },
            },
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*"],
            },
            "observability": {
              "enabled": true,
              "logs": {
                "enabled": true,
                "head_sampling_rate": 1,
              },
              "traces": {
                "enabled": true,
                "head_sampling_rate": 0.01,
              },
            },
          }
          '''), encoding="utf-8")

          Path("worker-env.d.ts").write_text(textwrap.dedent('''\
          /// <reference types="@cloudflare/workers-types" />

          interface Env {
            readonly INVOICE_RATE_LIMITER: RateLimit;
            readonly SETTLEMENT_RATE_LIMITER: RateLimit;
          }
          '''), encoding="utf-8")

          Path("tsconfig.worker.json").write_text(textwrap.dedent('''\
          {
            "compilerOptions": {
              "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.worker.tsbuildinfo",
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": true,
              "noImplicitOverride": true,
              "noFallthroughCasesInSwitch": true,
              "noUnusedLocals": true,
              "noUnusedParameters": true,
              "skipLibCheck": true,
              "isolatedModules": true,
              "noEmit": true,
              "types": ["@cloudflare/workers-types"]
            },
            "include": ["worker/**/*.ts", "worker-env.d.ts"],
            "exclude": ["worker/**/*.test.ts", "worker/test/**"]
          }
          '''), encoding="utf-8")

          Path("tsconfig.worker-test.json").write_text(textwrap.dedent('''\
          {
            "compilerOptions": {
              "tsBuildInfoFile": "./node_modules/.tmp/tsconfig.worker-test.tsbuildinfo",
              "target": "ES2022",
              "lib": ["ES2022"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": true,
              "skipLibCheck": true,
              "isolatedModules": true,
              "noEmit": true,
              "types": [
                "@cloudflare/workers-types",
                "@cloudflare/vitest-plugin/types"
              ]
            },
            "include": [
              "worker/**/*.test.ts",
              "worker/test/**/*.ts",
              "worker-env.d.ts"
            ]
          }
          '''), encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["scripts"].pop("worker:types", None)
          package["scripts"].pop("worker:types:check", None)
          package["scripts"]["verify"] = (
              "npm run format:check && npm run lint && npm run typecheck && "
              "npm run test && npm run test:worker && npm run build && npm run worker:dry-run"
          )
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "응답 유실 시 같은 provider callback을 다시 호출하지 않도록 발급 결과를 요청 ID별 Durable Object에 8일간 보관하며, 정산 메모는 서버에 저장하지 않습니다."
          new = "invoice 발급은 stateless Worker에서 처리하며, 브라우저가 발급 응답을 받지 못한 경우 같은 요청을 자동 재전송하지 않습니다. 활성 정산과 발급된 invoice는 브라우저 IndexedDB에 저장하고, 정산 메모를 별도 서버 상태로 보관하지 않습니다."
          if old not in text:
              raise SystemExit("README Durable Object sentence not found")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          architecture = Path("docs/payment-architecture.md")
          text = architecture.read_text(encoding="utf-8")
          text = text.replace(
              "- 허용 invoice 잔여 수명: 최대 24시간; replay 보관은 만료 후 확인 기간까지 포함한 8일",
              "- 허용 invoice 잔여 수명: 최대 24시간; 재발급 전후 invoice 이력은 브라우저에서 7일간 보관",
          )
          section_pattern = re.compile(r"## 중복 발급과 저장\n.*?\n## 규격 근거", re.S)
          section = '''## 발급 실패와 저장 경계

          invoice 발급 API는 서버에 replay 상태를 저장하지 않는 stateless 경로입니다. `requestId`는 이전 클라이언트와의 요청 형식 호환을 위해 남겨 두지만 Worker가 같은 ID의 과거 응답을 보관하거나 재생하지 않습니다.

          브라우저가 `/api/invoices`의 응답을 받지 못한 네트워크 수준 실패는 발급 결과가 불명확하므로 자동 재전송하지 않습니다. 클라이언트는 이를 `ISSUANCE_UNKNOWN`으로 처리하고, 정산자가 받는 지갑의 상태를 확인한 뒤 새 정산을 시작하도록 안내합니다. 반대로 Worker가 provider discovery 또는 callback의 명시적 실패 응답을 정상적으로 돌려준 경우에는 해당 실패 원인과 retryable 여부를 화면에 반영합니다.

          정상적으로 받은 BOLT11은 즉시 QR로 노출하지 않습니다. 먼저 브라우저 IndexedDB에 저장할 때까지 `awaitingPersistence` 상태로 유지하고, 저장이 성공한 invoice만 결제 QR로 표시합니다. 저장에 실패하면 해당 invoice는 화면에 표시하지 않고 실패 상태로 전환합니다.

          활성 정산 UI 상태, 참여자 이름, 발급된 invoice와 payment hash, 재발급 이력은 브라우저 IndexedDB에 저장합니다. IndexedDB v2는 revision compare-and-swap으로 저장과 삭제를 보호하며, 오래 열린 탭이 다른 탭의 최신 정산을 덮어쓰거나 삭제하려 하면 최신 상태를 다시 불러옵니다. 재발급 전후 invoice의 자동·수동 완료 근거는 7일간 이력에 남겨 지연 결제가 겹치면 이중 입금 가능성을 경고합니다.

          이 구조는 provider callback 자체의 exactly-once 발급을 보장하지 않습니다. 응답 유실이나 provider 내부 동작 때문에 화면에 노출되지 않은 미결제 invoice가 남을 수 있으므로, 자동 재전송보다 명시적인 실패 폐쇄를 선택합니다. Lightning Split은 해당 invoice를 자동 결제하지 않으며 사용자가 확인하지 못한 invoice를 QR로 노출하지 않습니다.

          ## 규격 근거'''
          text, count = section_pattern.subn(section, text, count=1)
          if count != 1:
              raise SystemExit(f"architecture section replacement count: {count}")
          architecture.write_text(text, encoding="utf-8")

          for deleted in [
              "worker/invoiceBatch.test.ts",
              "worker-configuration.d.ts",
              "wrangler.staging.jsonc",
          ]:
              Path(deleted).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Verify refactor
        run: npm run verify
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "qozm515"
          git config user.email "46486213+qozm515@users.noreply.github.com"
          git rm .github/workflows/refactor-stateless-invoice-once.yml
          git add -A
          git commit -m "Refactor invoice issuance to stateless worker"
          git push origin HEAD:refactor/stateless-invoice-issuance
