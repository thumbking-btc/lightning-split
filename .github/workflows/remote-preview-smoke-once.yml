name: Remote preview smoke diagnostic once

on:
  push:
    branches:
      - refactor/stateless-invoice-issuance

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.head_commit.message == 'Run remote preview smoke diagnostic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stateless-invoice-issuance
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Inspect live Cloudflare preview
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const url='https://refactor-stateless-invoice-issuance-lightning-split.thumbking-btc.workers.dev/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          const errors=[];
          page.on('console', msg=>{ console.log(`[console:${msg.type()}] ${msg.text()}`); if(msg.type()==='error') errors.push(msg.text()); });
          page.on('pageerror', err=>{ console.log(`[pageerror] ${err.stack||err.message}`); errors.push(err.stack||err.message); });
          page.on('requestfailed', req=>console.log(`[requestfailed] ${req.url()} ${req.failure()?.errorText}`));
          const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
          console.log('HTTP',response?.status());
          console.log('FINAL_URL',page.url());
          console.log('TITLE',await page.title());
          console.log('BODY_TEXT',(await page.locator('body').innerText()).slice(0,2500));
          console.log('ROOT_LENGTH',(await page.locator('#root').innerHTML()).length);
          const build=await page.evaluate(async()=>{try{return await (await fetch('/build.json',{cache:'no-store'})).json()}catch(e){return {error:String(e)}}});
          console.log('BUILD_JSON',JSON.stringify(build));
          console.log('SW',JSON.stringify(await page.evaluate(async()=>('serviceWorker' in navigator)?{controller:!!navigator.serviceWorker.controller,regs:(await navigator.serviceWorker.getRegistrations()).map(r=>({scope:r.scope,active:r.active?.scriptURL,waiting:r.waiting?.scriptURL,installing:r.installing?.scriptURL}))}:{unsupported:true})));
          await browser.close();
          if ((await response?.status()) !== 200) process.exit(2);
          if (errors.some(e=>!e.includes('favicon'))) process.exit(1);
          EOF
