name: Verify creator support panel

on:
  push:
    branches:
      - feature/creator-support-panel
    paths:
      - .github/workflows/verify-creator-support-panel.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-support-panel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci
      - run: npm run verify

      - name: Remove one-time verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-creator-support-panel.yml
          git commit -m "Remove one-time support panel verification workflow"
          git push origin HEAD:feature/creator-support-panel
