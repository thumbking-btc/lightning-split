name: Verify creator support panel

on:
  push:
    branches:
      - feature/creator-support-panel
    paths:
      - .github/workflows/verify-creator-support-panel.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-support-panel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Format only this change and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/app/CreatorContact.tsx \
            src/app/CreatorContact.test.tsx \
            src/app/CreatorContact.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/CreatorContact.tsx src/app/CreatorContact.test.tsx src/app/CreatorContact.css
          git rm .github/workflows/verify-creator-support-panel.yml
          git commit -m "Format and verify creator support panel"
          git push origin HEAD:feature/creator-support-panel

      - name: Check changed-file formatting
        run: npx prettier --check src/app/CreatorContact.tsx src/app/CreatorContact.test.tsx src/app/CreatorContact.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run worker:types:check
      - run: npm run test
      - run: npm run test:worker
      - run: npm run build
      - run: npm run worker:dry-run
